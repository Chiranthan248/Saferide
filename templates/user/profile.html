{% extends 'user/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <div class="card-header bg-primary text-white py-4 d-flex align-items-center">
                    <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=ffffff&color=2b6cb0&size=64" alt="User Avatar" class="rounded-circle me-3 border border-2 border-white">
                    <div>
                        <h4 class="mb-0">{{ request.user.username }}'s Profile</h4>
                        <small class="text-white-50">Manage your account and safety details</small>
                    </div>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <h5 class="text-primary border-bottom pb-2 mb-3"><i class="fas fa-user-circle me-2"></i>Personal Details</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">First Name</label>
                                    <input type="text" class="form-control" name="first_name" value="{{ request.user.first_name }}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Last Name</label>
                                    <input type="text" class="form-control" name="last_name" value="{{ request.user.last_name }}">
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h5 class="text-primary border-bottom pb-2 mb-3"><i class="fas fa-shield-alt me-2"></i>Safety Settings</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Your Phone Number</label>
                                    <input type="tel" class="form-control" name="phone" value="{{ commuter.phone }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Emergency Contact</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-danger text-white"><i class="fas fa-heart-pulse"></i></span>
                                        <input type="tel" class="form-control border-danger" name="emergency_contact" value="{{ commuter.emergency_contact }}" required>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small text-muted">Home Address</label>
                                    <textarea class="form-control" name="address" rows="2" required>{{ commuter.address }}</textarea>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a href="{% url 'user_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
